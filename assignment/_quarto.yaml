#
# PDFへの変換は以下のコマンドで
#
# $ quarto render --to typst
#
project:
  render:
    - assignment1.qmd
    - assignment2.qmd
    - assignment3.qmd
    - assignment4.qmd
    - assignment5.qmd
format:
  typst:
    papersize: a4
    font-paths:
      - fonts
    mainfont: "Harano Aji Gothic"
    sansfont: "Harano Aji Gothic"
    monofont: "Harano Aji Gothic"
    margin:
      top: 2cm
      bottom: 2cm
      left: 2cm
      right: 2cm
lang: ja
execute:
  freeze: auto
